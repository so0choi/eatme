<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --primary: #006e1c;
        --surface: #f8faf9;
        --card: #ffffff;
        --on: #191c1c;
        --variant: #3f4948;
        --container: #eceeee;
        --tertiary: #b02f00;
      }
      * { box-sizing: border-box; }
      body {
        width: 380px;
        margin: 0;
        font-family: -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
        background: var(--surface);
        color: var(--on);
      }
      .wrap { padding: 14px; }
      h1 { font-size: 15px; margin: 0 0 10px; }
      .row { display: flex; gap: 8px; align-items: center; }
      label.small { font-size: 12px; color: var(--variant); }
      input[type="date"] {
        flex: 1;
        border: 0;
        border-radius: 10px;
        background: var(--container);
        padding: 8px 10px;
        font-size: 13px;
        color: var(--on);
      }
      button {
        border: 0;
        border-radius: 10px;
        padding: 9px 12px;
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
        background: var(--primary);
        color: #fff;
        transition: opacity 0.15s;
      }
      button:hover { opacity: 0.9; }
      button:disabled { opacity: 0.5; cursor: default; }
      button.ghost { background: var(--container); color: var(--on); }
      .status {
        margin: 10px 0;
        font-size: 12px;
        color: var(--variant);
        min-height: 15px;
        line-height: 1.4;
      }
      .status.ok { color: var(--primary); font-weight: 700; }
      .status.err { color: var(--tertiary); font-weight: 700; }
      .toolbar { display: flex; justify-content: space-between; align-items: center; margin: 8px 0 6px; }
      .toolbar .muted { font-size: 12px; color: var(--variant); }
      .toolbar a { font-size: 12px; color: var(--primary); cursor: pointer; text-decoration: none; }
      #items {
        max-height: 300px;
        overflow-y: auto;
        border-radius: 10px;
        background: var(--card);
      }
      .item {
        display: flex;
        gap: 8px;
        align-items: flex-start;
        padding: 8px 10px;
      }
      .item + .item { border-top: 1px solid #f0f2f1; }
      .item input[type="checkbox"] { margin-top: 3px; }
      .item .body { flex: 1; min-width: 0; }
      .item .name { font-size: 13px; font-weight: 600; }
      .item.excluded .name { color: var(--variant); }
      .item .meta { font-size: 11px; color: var(--variant); margin-top: 2px; }
      .actions { display: flex; gap: 8px; margin-top: 10px; }
      .actions button { flex: 1; }
      .empty { padding: 16px; font-size: 12px; color: var(--variant); text-align: center; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>쿠팡 주문내역 → 냉부</h1>

      <div class="row">
        <label class="small" for="since">이후&nbsp;주문</label>
        <input type="date" id="since" />
        <button id="load">불러오기</button>
      </div>

      <div id="status" class="status"></div>

      <div class="toolbar" id="toolbar" style="display:none">
        <span class="muted" id="count"></span>
        <span><a id="checkAll">전체선택</a> · <a id="uncheckAll">전체해제</a></span>
      </div>

      <div id="items"></div>

      <div class="actions" id="actions" style="display:none">
        <button id="copy">선택 복사</button>
      </div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
